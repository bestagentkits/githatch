name: Deploy GitHoot to Cloudflare Edge

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build, Migrate, Set Secrets & Deploy
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck & Lint
        run: |
          npm run typecheck

      - name: Run Unit Tests
        run: npm test

      - name: Build Project
        run: npm run build
        env:
          NODE_ENV: production

      - name: Apply D1 Production Migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply githoot_db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=githoot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload Encrypted Runtime Secrets to Cloudflare Pages Functions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKENS: ${{ secrets.GH_TOKENS }}
          GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GH_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          [ -n "$GEMINI_API_KEY" ] && printf '%s' "$GEMINI_API_KEY" | npx wrangler pages secret put GEMINI_API_KEY --project-name=githoot || true
          [ -n "$GH_TOKENS" ] && printf '%s' "$GH_TOKENS" | npx wrangler pages secret put GITHUB_TOKENS --project-name=githoot || true
          [ -n "$GH_CLIENT_ID" ] && printf '%s' "$GH_CLIENT_ID" | npx wrangler pages secret put GITHUB_CLIENT_ID --project-name=githoot || true
          [ -n "$GH_CLIENT_SECRET" ] && printf '%s' "$GH_CLIENT_SECRET" | npx wrangler pages secret put GITHUB_CLIENT_SECRET --project-name=githoot || true
          [ -n "$AUTH_SECRET" ] && printf '%s' "$AUTH_SECRET" | npx wrangler pages secret put AUTH_SECRET --project-name=githoot || true
          [ -n "$R2_ACCESS_KEY_ID" ] && printf '%s' "$R2_ACCESS_KEY_ID" | npx wrangler pages secret put R2_ACCESS_KEY_ID --project-name=githoot || true
          [ -n "$R2_SECRET_ACCESS_KEY" ] && printf '%s' "$R2_SECRET_ACCESS_KEY" | npx wrangler pages secret put R2_SECRET_ACCESS_KEY --project-name=githoot || true
          [ -n "$R2_BUCKET_NAME" ] && printf '%s' "$R2_BUCKET_NAME" | npx wrangler pages secret put R2_BUCKET_NAME --project-name=githoot || true
