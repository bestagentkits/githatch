name: CI Quality Gates

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    name: Typecheck, Unit Tests, Determinism & Build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build Project
        run: npm run build
        env:
          NODE_ENV: production

      - name: Run Unit Tests
        run: npx vitest run tests/unit

      - name: Run Determinism & CLI Contract Tests
        run: node --test .agents/skills/githoot-hatch/scripts/tests/determinism.test.mjs

      - name: Verify Bundle Provenance
        run: node scripts/bundle-provenance.mjs verify
