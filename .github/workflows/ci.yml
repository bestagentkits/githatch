name: CI Quality Gates

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    name: Typecheck, Vitest, Autonomous QA & Build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run Unit Tests
        run: npx vitest run

      - name: Run Autonomous QA Suite
        run: npm test

      - name: Build Project
        run: npm run build
        env:
          NODE_ENV: production
